[project]
name = "task-manager-agent"
version = "0.1.0"
description = "CrewAI + Aider pipeline for automated task implementation"
requires-python = ">=3.11"
dependencies = [
    "crewai[tools]>=0.80.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
