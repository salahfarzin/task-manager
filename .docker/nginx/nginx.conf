server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /dashboard/task-manager {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /dashboard/task-manager/index.html;
    }

    # Optional: Redirect root to dashboard (if desired, otherwise remove)
    # location = / {
    #    return 301 /dashboard/task-manager/;
    # }
}
